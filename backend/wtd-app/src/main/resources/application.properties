# Servidor
server.port=${PORT:8080}
server.servlet.context-path=/api

# PostgreSQL — usa variables de entorno en producción, fallback local para desarrollo
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/wtd-db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Mufasa15/06/2018}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.root=INFO

# Notificaciones push (VAPID). Sin claves, el push queda desactivado y todo lo demás funciona igual.
# Generarlas una vez:  npx web-push generate-vapid-keys
vapid.public-key=${VAPID_PUBLIC_KEY:}
vapid.private-key=${VAPID_PRIVATE_KEY:}
vapid.subject=${VAPID_SUBJECT:mailto:wtd-app@example.com}
# Zona horaria con la que se decide "hoy" y la hora de los avisos
notifications.zone=${NOTIFICATIONS_ZONE:America/Argentina/Buenos_Aires}
