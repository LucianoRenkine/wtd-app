<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script src="js/theme.js?v=2"></script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WTD">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#0c121c">
    <script src="js/push.js?v=1" defer></script>
    <script src="js/novedades.js?v=2" defer></script>
    <title>Suscripciones - WTD</title>
    <script>if (!localStorage.getItem('wtdAuth')) location.replace('login.html');</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
        }

        header {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(var(--accent-rgb), 0.3);
            padding: 0 40px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .hamburger { background: none; border: none; color: var(--accent); cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 4px; }
        .hamburger span { display: block; width: 25px; height: 2px; background: var(--accent); border-radius: 2px; transition: all 0.3s; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(10px, 10px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(7px, -7px); }
        .logo { font-size: 1.3em; font-weight: 800; color: var(--accent); letter-spacing: 2px; text-decoration: none; }

        .sidebar {
            position: fixed; left: -300px; top: 0; width: 300px; height: 100vh;
            background: var(--bg); border-right: 1px solid rgba(var(--accent-rgb), 0.3);
            padding: 80px 20px 30px; transition: left 0.3s ease; z-index: 200; overflow-y: auto;
        }
        .sidebar.active { left: 0; }
        .sidebar nav ul { list-style: none; }
        .sidebar nav li { margin-bottom: 20px; }
        .sidebar nav a { text-decoration: none; color: var(--ink); font-size: 1.05em; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 5px; transition: all 0.3s; }
        .sidebar nav a:hover { color: var(--accent); background: rgba(var(--ink-rgb), 0.055); padding-left: 15px; }
        .sidebar nav a.active { color: var(--accent); font-weight: 600; background: rgba(var(--ink-rgb), 0.083); }
        .sidebar-divider { border: none; border-top: 1px solid rgba(var(--ink-rgb), 0.11); margin: 20px 10px; }
        .sidebar nav a.logout-link { color: var(--danger); }
        .sidebar nav a.logout-link:hover { color: var(--danger); background: rgba(225, 29, 72, 0.12); }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(46, 32, 60,0.5); opacity: 0; visibility: hidden; transition: all 0.3s; z-index: 150; }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        /* ───────── Página ───────── */
        .container { max-width: 820px; margin: 0 auto; padding: 32px 24px 90px; }

        .page-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
        .page-title { font-size: 1.9em; font-weight: 800; line-height: 1.1; }
        .page-subtitle { font-size: 0.9em; margin-top: 6px; color: var(--muted); }

        .seg { display: inline-flex; background: rgba(var(--ink-rgb), 0.055); border-radius: 12px; padding: 3px; gap: 2px; }
        .seg button { border: none; background: none; font: inherit; font-size: 0.86em; font-weight: 600; color: var(--muted); padding: 8px 16px; border-radius: 9px; cursor: pointer; transition: background .15s, color .15s; }
        .seg button:hover { color: var(--ink); }
        .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(28,27,34,.12); }

        .field { border: 1px solid rgba(var(--ink-rgb), 0.12); background: var(--surface); border-radius: 10px; font: inherit; font-size: 0.92em; padding: 10px 12px; color: var(--ink); min-width: 0; }
        .field:focus { outline: none; border-color: var(--accent); }
        .btn-primary { background: var(--btn); color: var(--on-btn); border: none; border-radius: 10px; font: inherit; font-size: 0.88em; font-weight: 600; padding: 10px 18px; cursor: pointer; transition: background .15s; }
        .btn-primary:hover { background: var(--accent); }
        .btn-primary:disabled { opacity: .35; cursor: default; background: var(--btn); }
        .btn-ghost { border: none; background: none; color: var(--muted); font: inherit; font-size: 0.88em; font-weight: 600; cursor: pointer; padding: 10px 12px; border-radius: 10px; }
        .btn-ghost:hover { background: rgba(var(--ink-rgb), .06); }
        .btn-danger { border: none; background: none; color: var(--danger); font: inherit; font-size: 0.86em; font-weight: 600; cursor: pointer; padding: 8px 4px; }
        .btn-danger:hover { text-decoration: underline; }

        .banner { font-size: 0.85em; line-height: 1.4; padding: 10px 14px; border-radius: 12px; margin-bottom: 16px; background: rgba(194, 90, 52, 0.09); border: 1px solid rgba(194, 90, 52, 0.25); color: #8a3d1d; }

        /* Hoy */
        .today-box { background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.12), rgba(var(--accent-rgb), 0.05)); border: 1px solid rgba(var(--accent-rgb), 0.25); border-radius: 16px; padding: 16px 18px; margin-bottom: 18px; }
        .today-box .t-title { font-size: 0.72em; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
        .today-row { font-size: 1.05em; font-weight: 700; }
        .today-row span { font-weight: 500; color: var(--accent-ink); font-size: 0.85em; margin-left: 6px; }

        /* Alta */
        .quick-add { background: var(--surface); border: 1px solid rgba(28, 27, 34, 0.09); border-radius: 16px; padding: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(28,27,34,.05); }
        .quick-add:focus-within { border-color: rgba(var(--accent-rgb), 0.45); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.09); }
        .quick-add .qa-name { flex: 1 1 200px; border: none; }
        .quick-add .qa-name:focus { border: none; }
        .quick-add input[type=number].d { width: 70px; }
        .quick-add input[type=number].y { width: 118px; }
        .form-err { font-size: 0.8em; color: var(--danger); min-height: 1.2em; margin: 0 4px 14px; }

        .search { position: relative; margin-bottom: 18px; }
        .search input { width: 100%; padding-left: 38px; }
        .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); }

        /* Lista */
        .panel { background: var(--surface); border: 1px solid rgba(28, 27, 34, 0.09); border-radius: 16px; padding: 6px 8px; box-shadow: 0 1px 2px rgba(28,27,34,.05); }
        .month-head { display: flex; align-items: baseline; gap: 8px; margin: 22px 2px 8px; font-weight: 700; }
        .month-head:first-child { margin-top: 0; }
        .month-head .n { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.8em; color: var(--accent); }
        .row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-bottom: 1px solid rgba(var(--ink-rgb), 0.055); border-radius: 10px; }
        .row:last-child { border-bottom: none; }
        .row:hover { background: rgba(var(--ink-rgb), 0.025); }
        .badge { width: 48px; flex-shrink: 0; text-align: center; border-radius: 11px; background: rgba(var(--ink-rgb), 0.045); padding: 6px 0 5px; line-height: 1.1; }
        .badge .d { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; font-size: 1.15em; }
        .badge .m { font-size: 0.64em; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
        .row.soon .badge { background: rgba(var(--accent-rgb), 0.1); }
        .row.soon .badge .d, .row.soon .badge .m { color: var(--accent); }
        .row.today .badge { background: var(--accent); }
        .row.today .badge .d, .row.today .badge .m { color: #fff; }
        .row-main { flex: 1; min-width: 0; cursor: pointer; }
        .row-title { font-size: 1em; font-weight: 600; word-break: break-word; }
        .row-main:hover .row-title { color: var(--accent); }
        .row-sub { font-size: 0.78em; color: var(--muted); margin-top: 2px; }
        .when { font-size: 0.8em; font-weight: 600; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
        .row.soon .when { color: var(--accent); }
        .row.today .when { color: var(--accent); font-weight: 800; }
        .icon-btn { border: none; background: none; color: var(--faint); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; }
        .icon-btn:hover { background: rgba(var(--ink-rgb), 0.07); color: var(--ink); }

        .empty { text-align: center; padding: 34px 14px; color: var(--faint); font-size: 0.9em; line-height: 1.5; }
        .empty b { display: block; color: var(--muted); font-weight: 600; margin-bottom: 2px; }

        /* Modales */
        .modal-overlay { position: fixed; inset: 0; background: rgba(28, 27, 34, 0.4); display: none; justify-content: center; align-items: center; z-index: 300; padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--surface); border-radius: 18px; padding: 24px; width: 100%; max-width: 420px; max-height: 92vh; overflow-y: auto; }
        .modal h3 { font-size: 1.1em; margin-bottom: 16px; }
        .form-row { margin-bottom: 14px; }
        .form-row label { display: block; font-size: 0.75em; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
        .form-row .field { width: 100%; }
        .form-row textarea.field { resize: vertical; min-height: 70px; font-family: inherit; }
        .form-split { display: flex; gap: 10px; }
        .form-split > * { flex: 1; }
        .modal-actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; }
        .modal-actions .btn-primary { margin-left: auto; }
        .confirm-modal { max-width: 360px; text-align: center; padding: 30px 26px 22px; }
        .confirm-icon { font-size: 2em; margin-bottom: 10px; }
        .confirm-text { font-size: 1.02em; font-weight: 600; line-height: 1.45; word-break: break-word; }
        .confirm-sub { font-size: 0.82em; color: var(--muted); margin-top: 6px; }
        .confirm-btns { display: flex; gap: 10px; justify-content: center; margin-top: 22px; }
        .confirm-btns .btn-ghost, .confirm-btns .btn-primary { flex: 1; }
        .btn-primary.btn-del { background: var(--danger); }
        .btn-primary.btn-del:hover { background: var(--danger); }


        .kinds { margin-bottom: 18px; }
        .summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
        .sum-card { flex: 1 1 150px; background: var(--surface); border: 1px solid rgba(28,27,34,.09); border-radius: 14px; padding: 12px 14px; }
        .sum-card .l { font-size: 0.7em; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
        .sum-card .v { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 1.2em; font-weight: 700; margin-top: 4px; }
        .quick-add select.field { max-width: 130px; }
        .quick-add input[type=number].amt { width: 110px; }
        .quick-add input[type=date].field { width: 150px; }
        .amount { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; font-size: 0.92em; white-space: nowrap; flex-shrink: 0; }
        .row.ended { opacity: .5; }
        .check-row { display: flex; align-items: center; gap: 8px; font-size: 0.88em; margin-bottom: 14px; }
        .check-row input { width: 16px; height: 16px; accent-color: var(--accent); }
        .qa-end { display: flex; align-items: center; gap: 6px; font-size: 0.8em; color: var(--muted); }

        [hidden] { display: none !important; }

        @media (max-width: 600px) {
            header { padding: 0 20px; }
            .container { padding: 22px 14px 80px; }
            .page-top .seg { width: 100%; }
            .page-top .seg button { flex: 1; }
            .quick-add .qa-name { flex-basis: 100%; }
            .when { font-size: 0.74em; }
        }
    </style>
    <link rel="stylesheet" href="css/theme.css?v=9">
</head>

<body>

    <header>
        <button class="hamburger" id="hamburger" aria-label="Menú"><span></span><span></span><span></span></button>
        <a href="index.html" class="logo">WTD</a>
        <div></div>
    </header>

    <div class="sidebar" id="sidebar">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="calendar.html">Calendario</a></li>
                <li><a href="watchlist.html">Watchlist</a></li>
                <li><a href="cumpleanos.html">Cumpleaños</a></li>
                <li><a href="suscripciones.html" class="active">Suscripciones</a></li>
                <hr class="sidebar-divider">
                <li><a href="#" class="logout-link" onclick="doLogout(event)">⏻ Cerrar sesión</a></li>
            </ul>
        </nav>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="container">
        <div class="page-top">
            <div>
                <h1 class="page-title">Suscripciones</h1>
                <p class="page-subtitle" id="pageSub">Suscripciones y tareas que se repiten solas.</p>
            </div>
            <div class="seg" id="kindSeg" role="tablist" aria-label="Tipo">
                <button data-k="SUBSCRIPTION" class="on">💳 Suscripciones</button>
                <button data-k="TASK">Tareas repetidas</button>
            </div>
        </div>

        <div class="banner" id="banner" hidden></div>
        <div class="summary" id="summary"></div>

        <form class="quick-add" id="quickAdd" autocomplete="off">
            <input class="field qa-name" id="qaName" name="rec-name" type="text" maxlength="80" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other">
            <span id="qaMoney" style="display:contents">
                <input class="field amt" id="qaAmount" type="number" min="0" step="0.01" placeholder="Costo" aria-label="Costo">
                <select class="field" id="qaCurrency" aria-label="Moneda"><option>ARS</option><option>USD</option><option>EUR</option></select>
            </span>
            <select class="field" id="qaFreq" aria-label="Frecuencia"></select>
            <input class="field" id="qaDate" type="date" aria-label="Primera fecha / día de renovación">
            <button class="btn-primary" id="qaBtn" type="submit">Agregar</button>
        </form>
        <div class="form-err" id="qaErr"></div>

        <div class="search">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input class="field" id="search" type="search" placeholder="Buscar…" aria-label="Buscar">
        </div>

        <div id="list"></div>
    </div>

    <!-- Editar -->
    <div class="modal-overlay" id="editModal">
        <form class="modal" id="editForm" autocomplete="off">
            <h3 id="efTitle">Editar</h3>
            <div class="form-row">
                <label for="efName">Nombre</label>
                <input class="field" id="efName" name="rec-name-edit" type="text" maxlength="80" required autocomplete="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other">
            </div>
            <div class="form-split form-row" id="efMoney">
                <div><label for="efAmount">Costo</label><input class="field" id="efAmount" type="number" min="0" step="0.01"></div>
                <div><label for="efCurrency">Moneda</label><select class="field" id="efCurrency"><option>ARS</option><option>USD</option><option>EUR</option></select></div>
            </div>
            <div class="form-split form-row">
                <div><label for="efFreq">Frecuencia</label><select class="field" id="efFreq"></select></div>
                <div><label for="efDate" id="efDateLabel">Renovación</label><input class="field" id="efDate" type="date" required></div>
            </div>
            <div class="form-row">
                <label class="check-row" style="margin:0 0 8px"><input type="checkbox" id="efForever"> Por tiempo indeterminado</label>
                <div id="efEndWrap"><label for="efEnd">Termina el</label><input class="field" id="efEnd" type="date"></div>
            </div>
            <div class="form-row" id="efSkipWrap" hidden>
                <label>Veces canceladas</label>
                <div id="efSkips"></div>
            </div>
            <div class="form-row">
                <label for="efNote">Nota</label>
                <textarea class="field" id="efNote" maxlength="400" placeholder="Plan, cuenta, tarjeta…"></textarea>
            </div>
            <div class="form-err" id="efErr"></div>
            <div class="modal-actions">
                <button type="button" class="btn-danger" id="efDelete">Eliminar</button>
                <button type="button" class="btn-ghost" id="efCancel">Cancelar</button>
                <button type="submit" class="btn-primary">Guardar</button>
            </div>
        </form>
    </div>

    <!-- Confirmar eliminación -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal confirm-modal" role="alertdialog" aria-labelledby="delText">
            <div class="confirm-icon">🗑</div>
            <p class="confirm-text" id="delText"></p>
            <p class="confirm-sub">Esta acción no se puede deshacer.</p>
            <div class="confirm-btns">
                <button type="button" class="btn-ghost" id="delCancel">Cancelar</button>
                <button type="button" class="btn-primary btn-del" id="delConfirm">Eliminar</button>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=5"></script>
    <script src="js/recurring.js?v=1"></script>
    <script>
        /* ── Hamburger ── */
        const hamburger      = document.getElementById('hamburger');
        const sidebar        = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            sidebar.classList.toggle('active');
            sidebarOverlay.classList.toggle('active');
        });
        sidebarOverlay.addEventListener('click', () => {
            hamburger.classList.remove('active');
            sidebar.classList.remove('active');
            sidebarOverlay.classList.remove('active');
        });
        function doLogout(e) {
            e.preventDefault();
            localStorage.removeItem('wtdAuth');
            window.location.href = 'login.html';
        }

        /* ── Estado ── */
        let items = [];
        let loaded = false;
        let kind = 'SUBSCRIPTION';
        let editingId = null;
        let pendingDeleteId = null;

        const $ = id => document.getElementById(id);
        const find = id => items.find(r => String(r.id) === String(id));
        const isSub = () => kind === 'SUBSCRIPTION';
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
        }
        const GEAR = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';

        function setBanner(msg) { $('banner').hidden = !msg; $('banner').textContent = msg || ''; }

        /* ── Datos ── */
        async function load() {
            const list = await RecurringApi.list();
            if (list === null) {
                setBanner(RecurringApi.notDeployed ? RECURRING_NOT_DEPLOYED : 'No se pudo conectar con el servidor. Probá de nuevo en un rato.');
                return;
            }
            setBanner('');
            items = list;
            loaded = true;
            render();
        }

        /* ── Render ── */
        function matches(r, q) {
            if (!q) return true;
            const hay = recNorm(`${r.name} ${r.note || ''} ${recWhenText(r)}`);
            return q.split(/\s+/).every(w => hay.includes(w));
        }

        function rowHtml(r, n) {
            const ended = !n;
            const cls = ended ? 'ended' : (n.days === 0 ? 'today' : (n.days <= 7 ? 'soon' : ''));
            const d = n ? n.date : new Date(r.endDate + 'T12:00:00');
            const sub = `${recWhenText(r)}${r.endDate ? ' · hasta el ' + r.endDate.split('-').reverse().join('/') : ' · sin fin'}${r.note ? ' · ' + esc(r.note) : ''}`;
            return `
            <div class="row ${cls}">
                <div class="badge"><div class="d">${d.getDate()}</div><div class="m">${REC_MONTHS[d.getMonth()].slice(0, 3)}</div></div>
                <div class="row-main" onclick="openEdit('${r.id}')">
                    <div class="row-title">${esc(r.name)}</div>
                    <div class="row-sub">${sub}</div>
                </div>
                ${r.kind === 'SUBSCRIPTION' ? `<span class="amount">${recMoney(r.amount, r.currency)}</span>` : ''}
                <span class="when">${ended ? 'Terminó' : recDaysText(n.days)}</span>
                <button class="icon-btn" onclick="openEdit('${r.id}')" aria-label="Editar" title="Editar">${GEAR}</button>
            </div>`;
        }

        function renderSummary(list) {
            if (!isSub()) { $('summary').innerHTML = ''; return; }
            const active = list.filter(r => recNext(r));
            const byCur = {};
            active.forEach(r => { byCur[r.currency || 'ARS'] = (byCur[r.currency || 'ARS'] || 0) + recMonthlyAmount(r); });
            const cur = Object.keys(byCur);
            const month = cur.length ? cur.map(c => recMoney(byCur[c], c)).join(' + ') : '—';
            const year = cur.length ? cur.map(c => recMoney(byCur[c] * 12, c)).join(' + ') : '—';
            $('summary').innerHTML =
                `<div class="sum-card"><div class="l">Por mes</div><div class="v">${month}</div></div>
                 <div class="sum-card"><div class="l">Por año</div><div class="v">${year}</div></div>
                 <div class="sum-card"><div class="l">Activas</div><div class="v">${active.length}</div></div>`;
        }

        function render() {
            const q = recNorm($('search').value).trim();
            const all = items.filter(r => r.kind === kind);
            const list = all.filter(r => matches(r, q));

            $('pageSub').textContent = all.length
                ? (isSub() ? `${all.length} ${all.length === 1 ? 'suscripción' : 'suscripciones'} · aparecen solas en el calendario cada renovación`
                           : `${all.length} ${all.length === 1 ? 'tarea' : 'tareas'} · aparecen solas en el calendario`)
                : (isSub() ? 'Cargá tus suscripciones y cuándo se renuevan.' : 'Tareas semanales, mensuales o anuales, por tiempo indeterminado.');

            renderSummary(all);
            if (!loaded) { $('list').innerHTML = ''; return; }
            if (!all.length) {
                $('list').innerHTML = `<div class="panel"><div class="empty"><b>${isSub() ? 'Todavía no hay suscripciones' : 'Todavía no hay tareas repetidas'}</b>Agregá la primera arriba.</div></div>`;
                return;
            }
            if (!list.length) {
                $('list').innerHTML = `<div class="panel"><div class="empty"><b>Sin resultados</b>Nada coincide con “${esc($('search').value.trim())}”.</div></div>`;
                return;
            }
            const sorted = list.map(r => ({ r, n: recNext(r) }))
                .sort((x, y) => (x.n ? x.n.days : 9999) - (y.n ? y.n.days : 9999) || x.r.name.localeCompare(y.r.name));
            $('list').innerHTML = `<div class="panel">${sorted.map(x => rowHtml(x.r, x.n)).join('')}</div>`;
        }

        /* ── Tipo (pestañas) ── */
        function applyKind() {
            $('qaName').placeholder = isSub() ? 'Nueva suscripción (Netflix, Spotify…)' : 'Nueva tarea repetida (pagar expensas, limpiar filtros…)';
            $('qaMoney').style.display = isSub() ? 'contents' : 'none';
            $('qaDate').title = isSub() ? 'Día de renovación' : 'Primera vez';
            $('qaErr').textContent = '';
            render();
        }
        $('kindSeg').addEventListener('click', e => {
            const b = e.target.closest('button[data-k]');
            if (!b) return;
            kind = b.dataset.k;
            document.querySelectorAll('#kindSeg button').forEach(x => x.classList.toggle('on', x === b));
            applyKind();
        });
        $('search').addEventListener('input', render);

        const freqOptions = Object.entries(REC_FREQ).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
        $('qaFreq').innerHTML = freqOptions;
        $('efFreq').innerHTML = freqOptions;
        $('qaFreq').value = 'MONTHLY';
        $('qaDate').value = toLocalDateStr(new Date());

        /* ── Alta ── */
        function validate(r) {
            if (!r.name) return 'Falta el nombre.';
            if (!r.startDate) return isSub() ? 'Elegí el día de renovación.' : 'Elegí la fecha.';
            if (r.endDate && r.endDate < r.startDate) return 'El fin no puede ser anterior al inicio.';
            if (r.kind === 'SUBSCRIPTION' && (r.amount == null || r.amount < 0)) return 'Poné el costo.';
            return null;
        }

        $('quickAdd').addEventListener('submit', async e => {
            e.preventDefault();
            const r = {
                kind, name: $('qaName').value.trim(), frequency: $('qaFreq').value,
                startDate: $('qaDate').value, endDate: null, note: null,
                amount: isSub() && $('qaAmount').value !== '' ? parseFloat($('qaAmount').value) : null,
                currency: isSub() ? $('qaCurrency').value : null
            };
            const err = validate(r);
            $('qaErr').textContent = err || '';
            if (err) return;
            $('qaBtn').disabled = true;
            const res = await RecurringApi.save(r);
            $('qaBtn').disabled = false;
            if (!res.ok) { $('qaErr').textContent = res.error; return; }
            items.push(res.data);
            $('qaName').value = ''; $('qaAmount').value = '';
            $('qaName').focus();
            render();
        });

        /* ── Editar ── */
        function syncForever() { $('efEndWrap').hidden = $('efForever').checked; }
        $('efForever').addEventListener('change', syncForever);

        function openEdit(id) {
            const r = find(id);
            if (!r) return;
            editingId = r.id;
            const sub = r.kind === 'SUBSCRIPTION';
            $('efTitle').textContent = sub ? 'Editar suscripción' : 'Editar tarea repetida';
            $('efMoney').hidden = !sub;
            $('efDateLabel').textContent = sub ? 'Renovación' : 'Primera vez';
            $('efName').value = r.name;
            $('efAmount').value = r.amount ?? '';
            $('efCurrency').value = r.currency || 'ARS';
            $('efFreq').value = r.frequency;
            $('efDate').value = r.startDate;
            $('efForever').checked = !r.endDate;
            $('efEnd').value = r.endDate || '';
            $('efNote').value = r.note || '';
            syncForever();
            renderSkips(r);
            $('efErr').textContent = '';
            $('editModal').classList.add('active');
            $('efName').focus();
        }
        /* Días cancelados de a uno desde el calendario: se pueden volver a poner. */
        function renderSkips(r) {
            const skips = recSkipped(r).sort();
            $('efSkipWrap').hidden = !skips.length;
            $('efSkips').innerHTML = skips.map(d =>
                `<div class="check-row" style="justify-content:space-between"><span>${d.split('-').reverse().join('/')}</span>` +
                `<button type="button" class="btn-ghost" onclick="restoreSkip('${d}')">Restaurar</button></div>`).join('');
        }
        async function restoreSkip(day) {
            const r = find(editingId);
            const res = await RecurringApi.save({ ...r, skippedDates: recSkipValue(recSkipped(r).filter(d => d !== day)) }, r.id);
            if (!res.ok) { $('efErr').textContent = res.error; return; }
            items[items.findIndex(x => x.id === r.id)] = res.data;
            renderSkips(res.data);
            render();
        }
        function closeEdit() { editingId = null; $('editModal').classList.remove('active'); }

        $('editForm').addEventListener('submit', async e => {
            e.preventDefault();
            const cur = find(editingId);
            const sub = cur.kind === 'SUBSCRIPTION';
            const r = {
                kind: cur.kind, name: $('efName').value.trim(), frequency: $('efFreq').value,
                startDate: $('efDate').value, endDate: $('efForever').checked ? null : ($('efEnd').value || null),
                note: $('efNote').value.trim(), skippedDates: cur.skippedDates,
                amount: sub && $('efAmount').value !== '' ? parseFloat($('efAmount').value) : null,
                currency: sub ? $('efCurrency').value : null
            };
            const err = validate(r);
            $('efErr').textContent = err || '';
            if (err) return;
            const res = await RecurringApi.save(r, editingId);
            if (!res.ok) { $('efErr').textContent = res.error; return; }
            const i = items.findIndex(x => String(x.id) === String(editingId));
            if (i >= 0) items[i] = res.data;
            closeEdit();
            render();
        });
        $('efCancel').addEventListener('click', closeEdit);
        $('editModal').addEventListener('click', e => { if (e.target === $('editModal')) closeEdit(); });

        /* ── Eliminar ── */
        $('efDelete').addEventListener('click', () => {
            const r = find(editingId);
            if (!r) return;
            pendingDeleteId = r.id;
            closeEdit();
            $('delText').textContent = `¿Eliminar "${r.name}"?`;
            $('deleteModal').classList.add('active');
            $('delCancel').focus();
        });
        function closeDelete() { pendingDeleteId = null; $('deleteModal').classList.remove('active'); }
        $('delCancel').addEventListener('click', closeDelete);
        $('deleteModal').addEventListener('click', e => { if (e.target === $('deleteModal')) closeDelete(); });
        $('delConfirm').addEventListener('click', async () => {
            const id = pendingDeleteId;
            closeDelete();
            if (id == null) return;
            if (await RecurringApi.remove(id)) {
                items = items.filter(r => String(r.id) !== String(id));
                render();
            } else {
                setBanner('No se pudo eliminar. Probá de nuevo.');
            }
        });

        document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeEdit(); closeDelete(); } });

        /* ── Inicio ── */
        (function init() {
            if (!loadAuth()) { window.location.href = 'login.html'; return; }
            const k = new URLSearchParams(location.search).get('k');
            if (k === 'TASK') {
                kind = 'TASK';
                document.querySelectorAll('#kindSeg button').forEach(x => x.classList.toggle('on', x.dataset.k === 'TASK'));
            }
            const q = new URLSearchParams(location.search).get('q');
            if (q) $('search').value = q;
            applyKind();
            load();
            document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
        })();
    </script>
</body>
</html>
