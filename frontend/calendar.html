<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario - WTD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fbfbfd;
            color: #1c1b22;
            line-height: 1.6;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #a63d63;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 2px 20px rgba(28, 27, 34, 0.055);
        }

        .logo {
            font-size: 1.6em;
            font-weight: 800;
            color: #a63d63;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .user-info {
            color: #1c1b22;
            font-size: 0.9em;
        }

        .hamburger {
            background: none;
            border: none;
            color: #a63d63;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 4px;
        }
        .hamburger span {
            display: block;
            width: 25px;
            height: 2px;
            background: #a63d63;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(10px, 10px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(7px, -7px); }

        .sidebar {
            position: fixed;
            left: -300px;
            top: 0;
            width: 300px;
            height: 100vh;
            background: #fbfbfd;
            border-right: 1px solid rgba(166, 61, 99, 0.3);
            padding: 80px 20px 30px;
            transition: left 0.3s ease;
            z-index: 200;
            overflow-y: auto;
        }
        .sidebar.active { left: 0; }
        .sidebar nav ul { list-style: none; }
        .sidebar nav li { margin-bottom: 20px; }
        .sidebar nav a {
            text-decoration: none;
            color: #1c1b22;
            font-size: 1.05em;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 5px;
            transition: all 0.3s;
        }
        .sidebar nav a:hover { color: #a63d63; background: rgba(28, 27, 34, 0.055); padding-left: 15px; }
        .sidebar nav a.active { color: #a63d63; font-weight: 600; background: rgba(28, 27, 34, 0.083); }
        .sidebar-divider { border: none; border-top: 1px solid rgba(28, 27, 34, 0.11); margin: 20px 10px; }
        .sidebar nav a.logout-link { color: #be123c; }
        .sidebar nav a.logout-link:hover { color: #e11d48; background: rgba(225, 29, 72, 0.12); }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(46, 32, 60,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 150;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 28px 28px 48px;
        }

        .page-title {
            font-size: 2.5em;
            color: #1c1b22;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 1px;
        }

        .calendar-wrapper { display: block; }

        /* ── Calendar macOS style ── */
        .calendar-section {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(28, 27, 34, 0.11);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px 16px;
            border-bottom: 1px solid rgba(28, 27, 34, 0.083);
        }

        .current-month {
            font-size: 1.6em;
            font-weight: 700;
            color: #1c1b22;
            letter-spacing: -0.3px;
        }

        .calendar-nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .calendar-nav button {
            background: rgba(28, 27, 34, 0.066);
            border: 1px solid rgba(166, 61, 99, 0.25);
            color: #a63d63;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 6px;
            font-size: 1em;
            padding: 5px 11px;
            line-height: 1;
        }

        .calendar-nav button:hover {
            background: rgba(166, 61, 99, 0.25);
            border-color: #a63d63;
        }

        .calendar-nav .today-btn {
            font-size: 0.82em;
            font-weight: 600;
            padding: 5px 12px;
            letter-spacing: 0.3px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .day-header {
            text-align: center;
            color: #4a4458;
            font-size: 0.72em;
            font-weight: 700;
            padding: 8px 0 6px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(28, 27, 34, 0.083);
            border-right: 1px solid rgba(28, 27, 34, 0.044);
        }
        .day-header:last-child { border-right: none; }

        .day-cell {
            min-height: max(122px, calc((100vh - 260px) / 6));
            display: flex;
            flex-direction: column;
            padding: 7px 7px 6px;
            border-right: 1px solid rgba(28, 27, 34, 0.055);
            border-bottom: 1px solid rgba(28, 27, 34, 0.055);
            cursor: pointer;
            transition: background 0.15s;
            vertical-align: top;
            overflow: hidden;
        }
        .day-cell:nth-child(7n) { border-right: none; }
        .day-cell:hover { background: rgba(28, 27, 34, 0.039); }

        .day-num {
            font-size: 0.85em;
            font-weight: 500;
            color: #7a7389;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 3px;
            align-self: flex-end;
            flex-shrink: 0;
        }

        .day-cell.today .day-num {
            background: #a63d63;
            color: white;
            font-weight: 700;
        }

        .day-cell.other-month { background: rgba(28, 27, 34, 0.025); cursor: default; }
        .day-cell.other-month .day-num { color: #c4c0cc; }
        .day-cell.other-month:hover { background: rgba(28, 27, 34, 0.025); }

        .day-cell.selected { background: rgba(28, 27, 34, 0.055); }
        .day-cell.selected .day-num { outline: 1px solid #a63d63; }

        .event-pill {
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 5px;
            padding: 3px 7px 3px 5px;
            border-radius: 5px;
            font-size: 0.71em;
            margin-bottom: 3px;
            overflow: hidden;
            line-height: 1.45;
            cursor: pointer;
            border-left-style: solid;
            transition: filter 0.15s;
        }
        .event-pill:hover { filter: brightness(0.94); }
        .event-pill .pill-text {
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .event-pill .pill-time { opacity: 0.72; font-weight: 500; }
        .event-pill .pill-mark {
            margin-left: auto;
            flex-shrink: 0;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .event-pill.done .pill-text { text-decoration: line-through; opacity: 0.55; }

        /* Acciones al hover: completar / editar / eliminar sin abrir el detalle */
        .pill-actions {
            display: none;
            position: absolute;
            top: 1px; right: 1px; bottom: 1px;
            align-items: center;
            gap: 1px;
            padding: 0 3px;
            background: #ffffff;
            border-radius: 0 4px 4px 0;
            box-shadow: -8px 0 6px -4px rgba(255, 255, 255, 0.95);
        }
        .event-pill:hover .pill-actions { display: flex; }
        .pill-action-btn {
            border: none;
            background: none;
            width: 15px;
            height: 15px;
            border-radius: 4px;
            font-size: 9px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            color: #45424f;
            flex-shrink: 0;
        }
        .pill-action-btn:hover { background: rgba(28, 27, 34, 0.1); }
        .pill-action-btn.done:hover  { color: #0f9d6b; }
        .pill-action-btn.delete:hover { color: #e11d48; }

        .event-more {
            font-size: 0.65em;
            color: #5b5468;
            padding: 1px 5px;
        }

        /* ── Entrada rápida dentro de la celda ── */
        .quick-add {
            width: 100%;
            border: none !important;
            background: rgba(166, 61, 99, 0.07) !important;
            border-radius: 5px !important;
            padding: 3px 6px;
            font-size: 0.72em;
            color: #1c1b22;
            outline: 1px dashed rgba(166, 61, 99, 0.45) !important;
            margin-top: 2px;
        }
        .quick-add::placeholder { color: #a49dae; }
        .quick-add:focus { outline: 1px solid #a63d63 !important; box-shadow: none !important; }

        /* ── Composer (modal de una tarea) ── */
        .composer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(28, 27, 34, 0.32);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 600;
            padding: 24px;
        }
        .composer-overlay.active { display: flex; }

        .composer {
            background: #fff;
            border: 1px solid rgba(28, 27, 34, 0.09);
            border-radius: 18px;
            width: 100%;
            max-width: 560px;
            max-height: calc(100vh - 48px);
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(28, 27, 34, 0.18);
            animation: popIn 0.2s ease;
        }

        .composer-head {
            padding: 22px 26px 0;
        }
        .composer-title-input {
            width: 100%;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            font-size: 1.45em;
            font-weight: 700;
            color: #1c1b22;
            padding: 0 0 6px !important;
            background: transparent !important;
        }
        .composer-title-input::placeholder { color: #c4c0cc; }
        .composer-when-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(28, 27, 34, 0.07);
        }
        .composer-when-group { display: flex; align-items: center; gap: 10px; }
        .composer-date-input {
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            background: transparent !important;
            padding: 4px 2px !important;
            font-size: 0.9em;
            font-weight: 600;
            color: #1c1b22;
        }
        .composer-date-input:focus { box-shadow: 0 0 0 2px rgba(166, 61, 99, 0.18) !important; border-radius: 6px !important; }
        .composer-weekday { font-size: 0.82em; color: #837e90; text-transform: capitalize; }

        /* Tarea / Evento */
        .type-toggle {
            display: flex;
            flex-shrink: 0;
            background: rgba(28, 27, 34, 0.045);
            border-radius: 8px;
            padding: 2px;
        }
        .type-btn {
            border: none;
            background: none;
            padding: 5px 12px;
            font-size: 0.78em;
            font-weight: 600;
            color: #837e90;
            border-radius: 6px;
            cursor: pointer;
            transition: background .15s, color .15s;
        }
        .type-btn.selected { background: #fff; color: #1c1b22; box-shadow: 0 1px 2px rgba(28,27,34,.1); }

        .field-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .field-label-row .field-label { margin-bottom: 0; }
        .allday-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78em;
            color: #45424f;
            cursor: pointer;
            user-select: none;
        }
        .allday-toggle input { accent-color: #1c1b22; }

        .composer-body { padding: 20px 26px 4px; display: flex; flex-direction: column; gap: 18px; }
        .composer-body input[type="date"] { padding: 9px 11px; font-size: 0.9em; }

        .field-label {
            display: block;
            font-size: 0.68em;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #837e90;
            margin-bottom: 8px;
        }

        .time-row { display: flex; align-items: center; gap: 10px; }
        .time-row input { flex: 1; padding: 9px 11px; font-size: 0.9em; }
        .time-row .sep { color: #a49dae; font-size: 0.85em; }

        .composer textarea {
            width: 100%;
            min-height: 66px;
            resize: vertical;
            padding: 10px 12px;
            font-size: 0.9em;
            line-height: 1.5;
        }

        /* Chips de categoría y prioridad */
        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            border-radius: 99px;
            border: 1px solid rgba(28, 27, 34, 0.11);
            background: #fff;
            color: #45424f;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, color 0.15s;
            user-select: none;
        }
        .chip:hover { border-color: rgba(28, 27, 34, 0.24); }
        .chip .chip-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
        .chip.selected {
            border-color: currentColor;
            background: color-mix(in srgb, currentColor 9%, #fff);
        }
        .chip:focus-visible { outline: 2px solid #a63d63; outline-offset: 2px; }

        .composer-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 26px 22px;
            margin-top: 6px;
            border-top: 1px solid rgba(28, 27, 34, 0.07);
        }
        .composer-hint { font-size: 0.72em; color: #a49dae; }
        .composer-hint kbd {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(28, 27, 34, 0.055);
            border-radius: 4px;
            padding: 1px 5px;
            font-size: 0.95em;
        }
        .composer-actions { display: flex; gap: 8px; }
        .btn-save, .btn-ghost {
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9em;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .btn-save { background: #1c1b22; color: #fff; border: 1px solid #1c1b22; }
        .btn-save:hover { background: #000; }
        .btn-save:disabled { opacity: 0.5; cursor: default; }
        .btn-ghost {
            background: #fff;
            color: #45424f;
            border: 1px solid rgba(28, 27, 34, 0.14);
        }
        .btn-ghost:hover { background: #f6f6f9; }
        .no-tasks {
            color: #5b5468;
            text-align: center;
            padding: 20px;
        }

        .loading {
            text-align: center;
            color: #8c8499;
            padding: 20px;
        }

        .error {
            background: rgba(28, 27, 34, 0.11);
            border: 2px solid #a63d63;
            color: #1c1b22;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 1024px) {
            .container { padding: 20px 14px 40px; }
            .day-cell { min-height: 96px; }
        }

        @media (max-width: 768px) {
            .page-title { font-size: 1.8em; }
            .day-cell { font-size: 0.8em; }
        }

        /* ── Task item clickable ── */
        .task-content { cursor: pointer; }
        .task-content:hover .task-title { color: #1c1b22; }

        /* ── Detail Panel ── */
        .detail-overlay {
            position: fixed;
            inset: 0;
            background: rgba(46, 32, 60,0.5);
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .detail-overlay.active { opacity: 1; visibility: visible; }

        .detail-panel {
            position: fixed;
            top: 0;
            right: -440px;
            width: 420px;
            height: 100vh;
            background: #ffffff;
            border-left: 1px solid rgba(166, 61, 99, 0.25);
            z-index: 310;
            display: flex;
            flex-direction: column;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .detail-panel.active { right: 0; }

        .detail-header {
            padding: 22px 28px 18px;
            border-bottom: 1px solid rgba(28, 27, 34, 0.083);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.98);
        }
        .detail-title-header {
            font-size: 1em;
            font-weight: 700;
            color: #1c1b22;
            letter-spacing: 0.5px;
        }
        .detail-close {
            background: none;
            border: 1px solid rgba(28, 27, 34, 0.11);
            color: #7a7389;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .detail-close:hover { background: rgba(28, 27, 34, 0.083); color: #1c1b22; border-color: #a63d63; }

        .detail-body {
            padding: 28px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .detail-task-title {
            font-size: 1.35em;
            font-weight: 700;
            color: #1c1b22;
            line-height: 1.35;
        }
        .detail-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .detail-badge {
            font-size: 0.78em;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px;
            color: white;
        }
        .detail-info-item {
            font-size: 0.75em;
            color: #7a7389;
            background: rgba(28, 27, 34, 0.033);
            border: 1px solid rgba(28, 27, 34, 0.066);
            border-radius: 20px;
            padding: 3px 10px;
            letter-spacing: 0.2px;
        }
        .detail-info-item.shared { color: #1c1b22; border-color: rgba(28, 27, 34, 0.25); background: rgba(28, 27, 34, 0.07); }
        .detail-desc-block {
            background: rgba(246, 243, 252, 0.9);
            border: 1px solid rgba(28, 27, 34, 0.083);
            border-radius: 10px;
            padding: 16px;
            font-size: 0.9em;
            color: #8c8499;
            line-height: 1.7;
            white-space: pre-wrap;
            flex: 1;
            min-height: 80px;
        }
        .detail-desc-empty {
            font-size: 0.88em;
            color: #b8b2c4;
            font-style: italic;
            text-align: center;
            padding: 24px;
        }
        .detail-link-row {
            display: block;
            margin-top: 14px;
            padding: 10px 14px;
            border: 1px solid rgba(28, 27, 34, 0.11);
            border-radius: 10px;
            font-size: 0.85em;
            color: #a63d63;
            text-decoration: none;
            word-break: break-all;
            transition: background .15s, border-color .15s;
        }
        .detail-link-row:hover { background: rgba(166, 61, 99, 0.06); border-color: rgba(166, 61, 99, 0.3); }
        .detail-actions {
            display: flex;
            gap: 10px;
            padding: 20px 28px;
            border-top: 1px solid rgba(28, 27, 34, 0.066);
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.98);
        }
        .detail-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.88em;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .detail-btn.complete {
            background: rgba(16, 185, 129, 0.12);
            color: #0f9d6b;
            border: 1px solid rgba(16, 185, 129, 0.22);
        }
        .detail-btn.complete:hover { background: rgba(16, 185, 129, 0.22); }
        .detail-btn.complete.done-state { background: rgba(5, 150, 105, 0.22); color: #0b8a5e; }
        .detail-btn.edit {
            background: rgba(28, 27, 34, 0.055);
            color: #1c1b22;
            border: 1px solid rgba(28, 27, 34, 0.11);
        }
        .icon-edit { flex-shrink: 0; }
        .icon-edit-label { vertical-align: -2px; margin-right: 3px; }
        .detail-btn.edit:hover { background: rgba(28, 27, 34, 0.1); }
        .detail-btn.delete {
            background: rgba(225, 29, 72, 0.1);
            color: #be123c;
            border: 1px solid rgba(225, 29, 72, 0.18);
        }
        .detail-btn.delete:hover { background: rgba(225, 29, 72, 0.2); color: #e11d48; }

        @media (max-width: 500px) {
            .detail-panel { width: 100%; right: -100%; }
        }

        /* ── Shared task ── */
        .share-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 10px 12px;
            border: 1px solid rgba(28, 27, 34, 0.11);
            border-radius: 8px;
            transition: all 0.2s;
            user-select: none;
            font-size: 0.9em;
            color: #857d95;
            margin-bottom: 15px;
        }
        .share-label:hover { border-color: #a63d63; background: rgba(28, 27, 34, 0.033); }
        .share-label input[type=checkbox] { display: none; }
        .share-box {
            width: 17px;
            height: 17px;
            border: 1.5px solid rgba(166, 61, 99, 0.35);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            font-size: 0.75em;
            color: transparent;
        }
        .share-label input:checked + .share-box { background: #a63d63; border-color: #a63d63; color: white; }
        .share-label:has(input:checked) { color: #1c1b22; border-color: rgba(28, 27, 34, 0.35); }

        /* Delete Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(46, 32, 60,0.65);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 500;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(166, 61, 99, 0.4);
            border-radius: 16px;
            padding: 36px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            animation: popIn 0.25s ease;
        }
        @keyframes popIn {
            from { transform: scale(0.92); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }
        .modal-icon { font-size: 2.2em; margin-bottom: 14px; }
        .modal-text { font-size: 1em; color: #1c1b22; margin-bottom: 24px; line-height: 1.6; }
        .modal-btns { display: flex; gap: 10px; justify-content: center; }
        .modal-btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-btn.cancel {
            background: rgba(28, 27, 34, 0.066);
            color: #1c1b22;
            border: 1px solid rgba(166, 61, 99, 0.25);
        }
        .modal-btn.cancel:hover { background: rgba(28, 27, 34, 0.11); }
        .modal-btn.confirm { background: #a63d63; color: white; }
        .modal-btn.confirm:hover { background: #1c1b22; }

        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(166, 61, 99, 0.4);
            border-radius: 10px;
            padding: 12px 22px;
            font-size: 0.88em;
            color: #1c1b22;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 400;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { border-color: rgba(244, 63, 94, 0.5); color: #f43f5e; }
        .toast.success { border-color: rgba(16, 185, 129, 0.5); color: #0b8a5e; }
    </style>

</head>
<body>
    <header>
        <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
        <a href="index.html" class="logo">WTD</a>
        <div class="user-info" id="userInfo">Cargando...</div>
    </header>

    <div class="sidebar" id="sidebar">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="calendar.html" class="active">Calendario</a></li>
                <li><a href="proximas.html">Tareas</a></li>
                <li><a href="watchlist.html">Watchlist</a></li>

    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="container">
        <div id="errorMessage" class="error" style="display:none;"></div>

        <div class="calendar-wrapper">
            <!-- Calendar -->
            <div class="calendar-section">
                <div class="calendar-header">
                    <div class="current-month" id="currentMonth">Cargando...</div>
                    <div class="calendar-nav">
                        <button id="prevBtn">‹</button>
                        <button id="todayBtn" class="today-btn">Hoy</button>
                        <button id="nextBtn">›</button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <div class="loading">Cargando calendario...</div>
                </div>
            </div>

        </div>
    </div>


    <!-- Composer: detalles de la tarea -->
    <div class="composer-overlay" id="composerOverlay">
        <form class="composer" id="composerForm">
            <div class="composer-head">
                <input type="text" class="composer-title-input" id="cTitle" placeholder="Nombre de la tarea" required>
                <div class="composer-when-row">
                    <div class="composer-when-group">
                        <input type="date" id="cDate" class="composer-date-input" required>
                        <span class="composer-weekday" id="cWeekday"></span>
                    </div>
                    <div class="type-toggle" id="cTypeToggle">
                        <button type="button" class="type-btn selected" data-type="TASK">Tarea</button>
                        <button type="button" class="type-btn" data-type="EVENT">Evento</button>
                    </div>
                </div>
            </div>

            <div class="composer-body">
                <div>
                    <div class="field-label-row">
                        <label class="field-label">Horario</label>
                        <label class="allday-toggle">
                            <input type="checkbox" id="cAllDay">
                            <span>Todo el día</span>
                        </label>
                    </div>
                    <div class="time-row" id="cTimeRow">
                        <input type="time" id="cStart" placeholder="Desde">
                        <span class="sep">→</span>

                <div>
                    <label class="field-label" for="cUntilDate">Hasta (si dura varios días)</label>
                    <input type="date" id="cUntilDate">

                <div>
                    <label class="field-label" for="cDesc">Descripción</label>
                    <textarea id="cDesc" placeholder="Detalles, links, lo que sea…"></textarea>
                </div>

                <div>
                    <label class="field-label" for="cLink">Link</label>
                    <input type="url" id="cLink" placeholder="https://…">
                </div>

                <div>
                    <label class="field-label">Categoría</label>
                    <div class="chip-row" id="cCategories"></div>

                <div>
                    <label class="field-label">Prioridad</label>

            <div class="composer-foot">
                <span class="composer-hint"><kbd>Enter</kbd> guarda · <kbd>Esc</kbd> cancela</span>
                <div class="composer-actions">
                    <button type="button" class="btn-ghost" onclick="closeComposer()">Cancelar</button>
                    <button type="submit" class="btn-save" id="cSubmit">Guardar</button>

    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <div class="modal-icon" id="modalIcon">💔</div>
            <p class="modal-text" id="modalText">¿Estás segura que querés eliminar esta tarea?</p>
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeModal()">Cancelar</button>
                <button class="modal-btn confirm" id="modalConfirmBtn" onclick="confirmDelete()">Eliminar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Detail Panel -->
    <div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>
    <div class="detail-panel" id="detailPanel">
        <div class="detail-header">
            <span class="detail-title-header">Detalle de tarea</span>
            <button class="detail-close" onclick="closeDetail()">✕</button>
        </div>
        <div class="detail-body">
            <div class="detail-task-title" id="detailTaskTitle"></div>
            <div class="detail-meta-row" id="detailMetaRow"></div>
            <div id="detailDescBlock"></div>
            <a href="#" id="detailLinkRow" class="detail-link-row" target="_blank" rel="noopener" style="display:none"></a>
        </div>
        <div class="detail-actions">
            <button class="detail-btn complete" id="detailCompleteBtn" onclick="detailToggleDone()">✓ Completar</button>
            <button class="detail-btn edit" onclick="detailEdit()"><svg class="icon-edit icon-edit-label" viewBox="0 0 20 20" width="13" height="13" fill="none" aria-hidden="true"><path d="M12.6 3.4 16.6 7.4 6.8 17.2H2.8v-4L12.6 3.4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M10.6 5.4 14.6 9.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg> Editar</button>
            <button class="detail-btn delete" onclick="detailAskDelete()">✕ Eliminar</button>
        </div>
    </div>

    <script src="js/catalog.js?v=2"></script>
    <script src="js/api.js?v=5"></script>
    <script>
        /* ── Hamburger ── */
        const hamburger      = document.getElementById('hamburger');
        const sidebar        = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            sidebar.classList.toggle('active');
            sidebarOverlay.classList.toggle('active');
        });
        sidebarOverlay.addEventListener('click', () => {
            hamburger.classList.remove('active');
            sidebar.classList.remove('active');
            sidebarOverlay.classList.remove('active');
        });

        function doLogout(e) {
            e.preventDefault();
            localStorage.removeItem('wtdAuth');
            window.location.href = 'login.html';
        }


        // State
        let currentDate = new Date();
        let selectedDate = new Date();
        let allTasks = [];
        let categories = [];
        let partnerId = null;

        // Initialize
        async function init() {
            if (!loadAuth()) {
                window.location.href = 'index.html';
                return;
            }

            // Load categories
            await loadCategories();
            renderPriorityChips();

            // ¿Venimos de otra página a editar una tarea puntual?
            // (calendar.html?edit=<id> — home y Tareas usan este link.)
            const params = new URLSearchParams(location.search);
            const editId = params.get('edit');
            const newFor = params.get('new'); // '1' = hoy, o una fecha YYYY-MM-DD puntual
            let editTask = null;
            let jumpToNewDay = null;

            if (editId) {
                editTask = await getTaskById(Number(editId));
                if (editTask) {
                    const d = new Date(editTask.startDate + 'T12:00:00');
                    currentDate  = new Date(d);
                    selectedDate = new Date(d);
                }
                history.replaceState(null, '', 'calendar.html');
            } else if (newFor) {
                jumpToNewDay = /^\d{4}-\d{2}-\d{2}$/.test(newFor) ? newFor : new Date().toISOString().split('T')[0];
                const d = new Date(jumpToNewDay + 'T12:00:00');
                currentDate  = new Date(d);
                selectedDate = new Date(d);
                history.replaceState(null, '', 'calendar.html');
            }

            // Load tasks
            await loadTasks();

            // Render calendar
            renderCalendar();

            if (editTask) openComposerForEdit(editTask);
            else if (jumpToNewDay) focusQuickAdd();

            // Load partner
            const users = await getUsers();
            const partner = users.find(u => u.id !== currentUserId && u.role !== 'admin');
            if (partner) {
                partnerId = partner.id;
                document.getElementById('cPartnerName').textContent = partner.nombre;
                document.getElementById('cShareField').style.display = '';
            }

            // Update user info
            if (currentUser) {
                document.getElementById('userInfo').textContent = `Hola, ${currentUser.nombre}`;
            }
        }

        async function loadCategories() {
            categories = await getCategories();
            renderCategoryChips();
        }

        async function loadTasks() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const from = new Date(year, month, 1).toISOString().split('T')[0];
            const to = new Date(year, month + 1, 0).toISOString().split('T')[0];

            allTasks = await getTasksByDateRange(from, to);
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Update month display (bold month + muted year)
            const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            document.getElementById('currentMonth').innerHTML =
                `${monthNames[month]} <span style="color:#b8b2c4;font-weight:400">${year}</span>`;

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // Day headers — Monday first
            const dayHeaders = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
            dayHeaders.forEach(day => {
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = day;
                grid.appendChild(header);
            });

            // First day of month — convert to Monday-first (0=Mon … 6=Sun)
            const rawFirst = new Date(year, month, 1).getDay(); // 0=Sun
            const firstDay = (rawFirst + 6) % 7;                 // 0=Mon

            // Previous month days
            const prevMonthDays = new Date(year, month, 0).getDate();
            for (let i = firstDay - 1; i >= 0; i--) {
                grid.appendChild(createDayCell(prevMonthDays - i, true, -1));
            }

            // Current month days
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let i = 1; i <= daysInMonth; i++) {
                grid.appendChild(createDayCell(i, false, 0));
            }

            // Fill remaining cells to complete last row
            const totalCells = grid.children.length - 7; // subtract header row
            const remainder = totalCells % 7;
            if (remainder !== 0) {
                for (let i = 1; i <= 7 - remainder; i++) {
                    grid.appendChild(createDayCell(i, true, 1));
                }
            }
        }

        function createDayCell(day, otherMonth, monthOffset) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const date = new Date(year, month + monthOffset, day);

            // Day number bubble
            const dayNum = document.createElement('div');
            dayNum.className = 'day-num';
            dayNum.textContent = day;
            cell.appendChild(dayNum);

            if (otherMonth) {
                cell.classList.add('other-month');
            } else {
                const dayStr = date.toISOString().split('T')[0];

                // Today?
                if (dayStr === new Date().toISOString().split('T')[0]) {
                    cell.classList.add('today');
                }

                // Selected?
                if (dayStr === selectedDate.toISOString().split('T')[0]) {
                    cell.classList.add('selected');
                }

                // Píldoras de eventos
                const dayTasks = allTasks.filter(t => t.startDate === dayStr);
                const isSelected = cell.classList.contains('selected');
                const MAX_PILLS = isSelected ? 3 : 4;

                dayTasks.slice(0, MAX_PILLS).forEach(task => {
                    cell.appendChild(buildPill(task));
                });
                if (dayTasks.length > MAX_PILLS) {
                    const more = document.createElement('div');
                    more.className = 'event-more';
                    more.textContent = `+${dayTasks.length - MAX_PILLS} más`;
                    cell.appendChild(more);
                }

                // Entrada rápida en el día seleccionado
                if (isSelected) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'quick-add';
                    input.id = 'quickAdd';
                    input.placeholder = '+ Tarea…';
                    input.autocomplete = 'off';
                    input.value = quickAddDraft;
                    input.addEventListener('click', e => e.stopPropagation());
                    input.addEventListener('input', () => { quickAddDraft = input.value; });
                    input.addEventListener('keydown', e => {
                        if (isEnter(e)) {
                            e.preventDefault();
                            const title = input.value.trim();
                            if (!title) return;
                            quickAddDraft = '';
                            input.value = '';
                            openComposer(title, dayStr);
                        } else if (e.key === 'Escape') {
                            input.blur();
                        }
                    });
                    cell.appendChild(input);
                }

                // Seleccionar el día y dejar el cursor listo para escribir
                cell.addEventListener('click', () => {
                    if (dayStr === selectedDate.toISOString().split('T')[0]) {
                        focusQuickAdd();
                        return;
                    }
                    selectedDate = date;
                    quickAddDraft = '';
                    renderCalendar();
                    focusQuickAdd();
                });
            }

            return cell;
        }

        /* Una píldora = color de categoría + ícono + barra de prioridad */
        function buildPill(task) {
            const cat  = catStyle(task.category);
            const prio = prioStyle(task.priority);

            const pill = document.createElement('div');
            pill.className = 'event-pill' + (task.completed ? ' done' : '');
            pill.style.backgroundColor = cat.color + '1f';
            pill.style.color = cat.color;
            pill.style.borderLeftWidth = prio.bar + 'px';
            pill.style.borderLeftColor = cat.color;
            pill.style.fontWeight = prio.weight;
            pill.style.opacity = prio.opacity;

            const time = task.startTime
                ? `<span class="pill-time">${task.startTime.substring(0, 5)}</span> `
                : '';
            pill.innerHTML =
                `<span class="pill-text">${time}${escapeHtml(task.title)}</span>` +
                (prio.mark ? `<span class="pill-mark">${prio.mark}</span>` : '') +
                (task.sharedWith?.length ? `<span class="pill-mark">💕</span>` : '') +
                `<span class="pill-actions">
                    <button type="button" class="pill-action-btn done" title="Completar">✓</button>
                    <button type="button" class="pill-action-btn edit" title="Editar"><svg class="icon-edit" viewBox="0 0 20 20" width="11" height="11" fill="none" aria-hidden="true"><path d="M12.6 3.4 16.6 7.4 6.8 17.2H2.8v-4L12.6 3.4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M10.6 5.4 14.6 9.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
                    <button type="button" class="pill-action-btn delete" title="Eliminar">✕</button>
                </span>`;
            pill.title = task.title;
            pill.addEventListener('click', e => { e.stopPropagation(); openDetail(task.id); });
            pill.querySelector('.pill-action-btn.done').addEventListener('click', e => {
                e.stopPropagation(); toggleTask(task.id);
            });
            pill.querySelector('.pill-action-btn.edit').addEventListener('click', e => {
                e.stopPropagation(); openComposerForEdit(task);
            });
            pill.querySelector('.pill-action-btn.delete').addEventListener('click', e => {
                e.stopPropagation(); askDelete(task.id);
            });
            return pill;
        }

        /* Algunos navegadores/entornos mandan e.key vacío: chequeamos también el código */
        function isEnter(e) {
            return e.key === 'Enter' || e.keyCode === 13 || e.which === 13;
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c =>
                ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
        }

        function focusQuickAdd() {
            requestAnimationFrame(() => {
                const el = document.getElementById('quickAdd');
                if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
            });
        }

        async function toggleTask(taskId) {
            const task = allTasks.find(t => t.id === taskId);
            if (!task) return;
            task.completed = !task.completed;
            renderCalendar();
            const updated = await updateTask(taskId, task);
            if (updated) {
                showToast(task.completed ? '¡Tarea completada! ✓' : 'Tarea desmarcada', 'success');
            } else {
                task.completed = !task.completed; // rollback
                renderCalendar();
                showToast('No se pudo actualizar la tarea', 'error');
            }
        }

        let pendingDeleteId = null;

        function askDelete(taskId) {
            pendingDeleteId = taskId;
            const task = allTasks.find(t => t.id === taskId);
            const date = task ? new Date((task.startDate || '') + 'T12:00:00') : null;
            if (date && date.getDate() === 21) {
                document.getElementById('modalIcon').textContent = '💔💔💔';
                document.getElementById('modalText').textContent = '¡¿QUERÉS CORTAR CONMIGO?!';
                document.getElementById('modalConfirmBtn').style.background = '#a63d63';
            } else {
                document.getElementById('modalIcon').textContent = '💔';
                document.getElementById('modalText').textContent = '¿Estás segura que querés eliminar esta tarea?';
                document.getElementById('modalConfirmBtn').style.background = '';
            }
            document.getElementById('deleteModal').classList.add('active');
        }

        async function confirmDelete() {
            if (!pendingDeleteId) return;
            const deleted = await deleteTask(pendingDeleteId);
            if (deleted) {
                allTasks = allTasks.filter(t => t.id !== pendingDeleteId);
                renderCalendar();
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('deleteModal').classList.remove('active');
            pendingDeleteId = null;
        }

        document.getElementById('deleteModal').addEventListener('click', e => {
            if (e.target === document.getElementById('deleteModal')) closeModal();
        });

        /* ── Composer: chips, apertura, guardado ── */
        let composerDate     = null;
        let composerCatId    = null;
        let composerPrio     = 'NONE';
        let composerItemType = 'TASK';
        let editingTaskId    = null;
        let quickAddDraft    = '';

        const WEEKDAYS_LONG = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

        function updateWeekdayLabel() {
            const val = document.getElementById('cDate').value;
            document.getElementById('cWeekday').textContent =
                val ? WEEKDAYS_LONG[new Date(val + 'T12:00:00').getDay()] : '';
        }

        document.getElementById('cDate').addEventListener('change', e => {
            composerDate = e.target.value;
            document.getElementById('cUntilDate').min = composerDate;
            updateWeekdayLabel();
        });

        /* Tarea / Evento */
        document.querySelectorAll('#cTypeToggle .type-btn').forEach(btn => {
            btn.addEventListener('click', () => selectItemType(btn.dataset.type));
        });

        function selectItemType(type) {
            composerItemType = type;
            document.querySelectorAll('#cTypeToggle .type-btn').forEach(b =>
                b.classList.toggle('selected', b.dataset.type === type));
        }

        /* Todo el día: sin horario tiene sentido, así que ocultamos los
           campos de hora en vez de dejarlos ahí sin usar. */
        document.getElementById('cAllDay').addEventListener('change', e => {
            document.getElementById('cTimeRow').style.display = e.target.checked ? 'none' : '';
        });

        function renderCategoryChips() {
            const row = document.getElementById('cCategories');
            row.innerHTML = categories.map(cat => {
                const st = catStyle(cat);
                return `<button type="button" class="chip" data-cat="${cat.id}" style="color:${st.color}">
                            <span class="chip-dot" style="background:${st.color}"></span><span>${cat.name}</span>
                        </button>`;
            }).join('');
            row.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => selectCategory(Number(chip.dataset.cat)));
            });
        }

        function selectCategory(id) {
            composerCatId = id;
            if (id) localStorage.setItem('wtdLastCategory', id);
            document.querySelectorAll('#cCategories .chip').forEach(c =>
                c.classList.toggle('selected', Number(c.dataset.cat) === id));
        }

        function renderPriorityChips() {
            const row = document.getElementById('cPriorities');
            row.innerHTML = PRIORITY_ORDER.map(key => {
                const st = PRIORITY_STYLE[key];
                return `<button type="button" class="chip" data-prio="${key}" style="color:${st.color}">
                            <span class="chip-dot" style="background:${st.color}"></span><span>${st.label}${st.mark ? ' ' + st.mark : ''}</span>
                        </button>`;
            }).join('');
            row.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => selectPriority(chip.dataset.prio));
            });
        }

        function selectPriority(key) {
            composerPrio = key;
            document.querySelectorAll('#cPriorities .chip').forEach(c =>
                c.classList.toggle('selected', c.dataset.prio === key));
        }

        function openComposer(title, dayStr) {
            editingTaskId = null;
            composerDate  = dayStr;

            document.getElementById('cTitle').value = title;
            document.getElementById('cDate').value  = dayStr;
            updateWeekdayLabel();
            document.getElementById('cStart').value = '';
            document.getElementById('cEnd').value   = '';
            document.getElementById('cUntilDate').value = '';
            document.getElementById('cUntilDate').min   = dayStr;
            document.getElementById('cDesc').value  = '';
            document.getElementById('cLink').value  = '';
            document.getElementById('cShared').checked = false;
            document.getElementById('cAllDay').checked = false;
            document.getElementById('cTimeRow').style.display = '';

            selectItemType('TASK');

            // La categoría arranca con lo último que usaste: menos clicks en
            // el caso común. La prioridad, en cambio, siempre arranca en
            // "Sin prioridad" — es el default explícito de toda tarea nueva.
            const lastCat = Number(localStorage.getItem('wtdLastCategory'));
            const known   = categories.some(c => c.id === lastCat);
            selectCategory(known ? lastCat : (categories[0]?.id ?? null));
            selectPriority('NONE');

            document.getElementById('cSubmit').textContent = 'Guardar';
            document.getElementById('composerOverlay').classList.add('active');
            requestAnimationFrame(() => document.getElementById('cStart').focus());
        }

        /* Edita una tarea existente: precarga todo y el submit hace PUT
           en vez de POST. Se llega acá desde el detalle, el hover de una
           píldora/tarjeta, o desde otra página vía calendar.html?edit=<id>. */
        function openComposerForEdit(task) {
            editingTaskId = task.id;
            composerDate  = task.startDate;

            document.getElementById('cTitle').value = task.title;
            document.getElementById('cDate').value  = task.startDate;
            updateWeekdayLabel();
            document.getElementById('cStart').value = task.startTime ? task.startTime.substring(0, 5) : '';
            document.getElementById('cEnd').value   = task.endTime   ? task.endTime.substring(0, 5)   : '';
            document.getElementById('cUntilDate').value = task.endDate || '';
            document.getElementById('cUntilDate').min   = task.startDate;
            document.getElementById('cDesc').value  = task.description || '';
            document.getElementById('cLink').value  = task.link || '';
            document.getElementById('cShared').checked = !!(task.sharedWith && task.sharedWith.length);
            document.getElementById('cAllDay').checked = !!task.allDay;
            document.getElementById('cTimeRow').style.display = task.allDay ? 'none' : '';

            selectItemType(task.itemType === 'EVENT' ? 'EVENT' : 'TASK');
            selectCategory(task.category?.id ?? null);
            selectPriority(task.priority || 'NONE');

            document.getElementById('cSubmit').textContent = 'Guardar cambios';
            document.getElementById('composerOverlay').classList.add('active');
            requestAnimationFrame(() => document.getElementById('cTitle').focus());
        }

        function closeComposer() {
            document.getElementById('composerOverlay').classList.remove('active');
            composerDate  = null;
            editingTaskId = null;
            focusQuickAdd();
        }

        document.getElementById('composerOverlay').addEventListener('click', e => {
            if (e.target.id === 'composerOverlay') closeComposer();
        });

        /* Enter guarda desde cualquier campo salvo la descripción
           (ahí Enter hace salto de línea y Cmd/Ctrl+Enter guarda). */
        document.getElementById('composerForm').addEventListener('keydown', e => {
            if (!isEnter(e)) return;
            const inTextarea = e.target.tagName === 'TEXTAREA';
            if (inTextarea && !(e.metaKey || e.ctrlKey)) return;
            e.preventDefault();
            document.getElementById('composerForm').requestSubmit();
        });

        document.getElementById('composerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('cTitle').value.trim();
            if (!title || !composerDate) return;

            const untilRaw = document.getElementById('cUntilDate').value || null;
            if (untilRaw && untilRaw < composerDate) {
                showToast('"Hasta" no puede ser antes del día elegido', 'error');
                return;
            }

            const existing   = editingTaskId ? allTasks.find(t => t.id === editingTaskId) : null;
            const wasEditing = !!editingTaskId;
            const allDay     = document.getElementById('cAllDay').checked;
            const btn      = document.getElementById('cSubmit');
            btn.disabled = true;

            const payload = {
                title,
                description: document.getElementById('cDesc').value || null,
                link:      document.getElementById('cLink').value || null,
                startDate: composerDate,
                endDate:   untilRaw,
                allDay,
                startTime: allDay ? null : (document.getElementById('cStart').value || null),
                endTime:   allDay ? null : (document.getElementById('cEnd').value   || null),
                category:  composerCatId ? { id: composerCatId } : null,
                priority:  composerPrio,
                itemType:  composerItemType,
                completed: existing ? existing.completed : false,
                createdBy: { id: currentUserId }
            };

            const saved = editingTaskId
                ? await updateTask(editingTaskId, payload)
                : await createTask(payload);
            btn.disabled = false;

            if (!saved) {
                showToast(editingTaskId ? 'No se pudieron guardar los cambios' : 'No se pudo crear la tarea', 'error');
                return;
            }

            const wasShared  = !!(existing?.sharedWith?.length);
            const wantShared = document.getElementById('cShared').checked;
            if (wantShared && !wasShared && partnerId) {
                await shareTask(saved.id, partnerId);
            } else if (!wantShared && wasShared && partnerId) {
                await unshareTask(saved.id, partnerId);
            }

            closeComposer();
            await loadTasks();
            renderCalendar();
            focusQuickAdd();
            showToast(wasEditing ? 'Cambios guardados ✓' : 'Tarea agregada ✓', 'success');
        });

        // Navigation
        document.getElementById('prevBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            loadTasks().then(() => renderCalendar());
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            loadTasks().then(() => renderCalendar());
        });

        document.getElementById('todayBtn').addEventListener('click', () => {
            currentDate = new Date();
            selectedDate = new Date();
            loadTasks().then(() => renderCalendar());
        });

        function showToast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = `toast ${type} show`;
            clearTimeout(el._t);
            el._t = setTimeout(() => el.classList.remove('show'), 3000);
        }

        /* ── Detail Panel ── */
        let detailTaskId = null;

        const MONTHS_DETAIL   = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
        const WEEKDAYS_DETAIL = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

        function openDetail(taskId) {
            const task = allTasks.find(t => t.id === taskId);
            if (!task) return;
            detailTaskId = taskId;

            document.getElementById('detailTaskTitle').textContent = task.title;

            const cat  = catStyle(task.category);
            const prio = prioStyle(task.priority);

            let metaHTML = `<span class="detail-badge" style="background:${cat.color}">${task.category?.name || 'Sin categoría'}</span>`;
            metaHTML += `<span class="detail-info-item">${task.itemType === 'EVENT' ? 'Evento' : 'Tarea'}</span>`;

            if (task.startDate) {
                const d = new Date(task.startDate + 'T12:00:00');
                let dateStr = `${WEEKDAYS_DETAIL[d.getDay()]} ${d.getDate()} de ${MONTHS_DETAIL[d.getMonth()]}`;
                if (task.endDate && task.endDate !== task.startDate) {
                    const dEnd = new Date(task.endDate + 'T12:00:00');
                    dateStr += ` → ${WEEKDAYS_DETAIL[dEnd.getDay()]} ${dEnd.getDate()} de ${MONTHS_DETAIL[dEnd.getMonth()]}`;
                }
                metaHTML += `<span class="detail-info-item">${dateStr}</span>`;
            }
            if (task.allDay) {
                metaHTML += `<span class="detail-info-item">Todo el día</span>`;
            } else if (task.startTime) {
                const t   = task.startTime.substring(0, 5);
                const end = task.endTime ? ` → ${task.endTime.substring(0, 5)}` : '';
                metaHTML += `<span class="detail-info-item">${t}${end}</span>`;
            }
            if (prio.label !== 'Sin prioridad') {
                metaHTML += `<span class="detail-info-item">Prioridad ${prio.label}${prio.mark ? ' ' + prio.mark : ''}</span>`;
            }
            if (task.createdBy?.nombre) metaHTML += `<span class="detail-info-item">Por ${task.createdBy.nombre}</span>`;
            if (task.sharedWith?.length) metaHTML += `<span class="detail-info-item shared">Compartida</span>`;

            document.getElementById('detailMetaRow').innerHTML = metaHTML;

            const descEl = document.getElementById('detailDescBlock');
            if (task.description) {
                descEl.className   = 'detail-desc-block';
                descEl.textContent = task.description;
            } else {
                descEl.className   = 'detail-desc-empty';
                descEl.textContent = 'Sin descripción';
            }

            const linkEl = document.getElementById('detailLinkRow');
            if (task.link) {
                linkEl.href = task.link;
                linkEl.textContent = '🔗 ' + task.link;
                linkEl.style.display = '';
            } else {
                linkEl.style.display = 'none';
            }

            const btn = document.getElementById('detailCompleteBtn');
            if (task.completed) {
                btn.textContent = '↩ Desmarcar';
                btn.classList.add('done-state');
            } else {
                btn.textContent = '✓ Completar';
                btn.classList.remove('done-state');
            }

            document.getElementById('detailPanel').classList.add('active');
            document.getElementById('detailOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('active');
            document.getElementById('detailOverlay').classList.remove('active');
            document.body.style.overflow = '';
            detailTaskId = null;
        }

        async function detailToggleDone() {
            if (!detailTaskId) return;
            await toggleTask(detailTaskId);
            closeDetail();
        }

        function detailAskDelete() {
            const id = detailTaskId;
            closeDetail();
            askDelete(id);
        }

        function detailEdit() {
            const task = allTasks.find(t => t.id === detailTaskId);
            if (!task) return;
            closeDetail();
            openComposerForEdit(task);
        }

        /* ── Atajos de teclado globales ── */
        document.addEventListener('keydown', e => {
            const composerOpen = document.getElementById('composerOverlay').classList.contains('active');
            const detailOpen   = document.getElementById('detailPanel').classList.contains('active');
            const modalOpen    = document.getElementById('deleteModal').classList.contains('active');

            if (e.key === 'Escape') {
                if (modalOpen)         { closeModal();    return; }
                if (composerOpen)      { closeComposer(); return; }
                if (detailOpen)        { closeDetail();   return; }
                document.activeElement?.blur();
                return;
            }
            if (composerOpen || modalOpen) return;

            const typing = ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);

            // Enter en cualquier lado: cursor listo para escribir en el día elegido
            if (isEnter(e) && !typing) {
                e.preventDefault();
                focusQuickAdd();
                return;
            }

            // Flechas: moverse por los días (también con el cursor en la entrada vacía)
            const inEmptyQuickAdd = document.activeElement?.id === 'quickAdd'
                                    && !document.activeElement.value;
            if (typing && !inEmptyQuickAdd) return;

            const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
            if (step === undefined) return;
            e.preventDefault();

            const next = new Date(selectedDate);
            next.setDate(next.getDate() + step);
            selectedDate = next;
            quickAddDraft = '';

            if (next.getMonth() !== currentDate.getMonth() || next.getFullYear() !== currentDate.getFullYear()) {
                currentDate = new Date(next);
                loadTasks().then(() => { renderCalendar(); focusQuickAdd(); });
            } else {
                renderCalendar();
                focusQuickAdd();
            }
        });

        // Start
        init();
    </script>
</body>
</html>
